name: cdk-diff

on:
  pull_request:
    branches:
      - mainline
    paths:
      - 'flights/**'
      - 'src/**'
      - 'cdk/**'
      - '.github/workflows/cdk-diff.yml'
      - 'pyproject.toml'
      - 'poetry.lock'

env:
  AWS_REGION: "us-east-1"

jobs:
  diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for OIDC authentication
      pull-requests: write  # Required to post comments

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Python/Poetry Setup
      - name: Install poetry
        run: pipx install poetry

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'poetry'

      - name: Install Python dependencies
        run: poetry install

      # Generate Flight Maps
      - name: Generate flight maps
        run: |
          mkdir -p output
          poetry run connections batch -d flights -o output
        continue-on-error: false

      # Generate Index Page
      - name: Generate index page
        run: poetry run connections index -d output -o output/index.html
        continue-on-error: false

      # Node.js/CDK Setup
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: cdk/package-lock.json

      - name: Install CDK dependencies
        working-directory: cdk
        run: npm ci

      - name: Build CDK application
        working-directory: cdk
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Synthesize
        working-directory: cdk
        run: npx cdk synth

      - name: CDK Diff
        uses: corymhall/cdk-diff-action@v2
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          allowedDestroyTypes: |
            Custom::CDKBucketDeployment
            AWS::Lambda::LayerVersion
          cdkOutDir: cdk/build/cdk.out

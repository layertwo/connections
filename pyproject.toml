[project]
name = "connections"
version = "0.1.0"
description = "flight to connections map"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "airports-py==3.1.0",
    "plotly==6.9.0",
    "geojson==3.3.0",
    "click==8.4.2",
    "setuptools>=82.0.0",
    "kaleido==1.3.0",
    "jinja2==3.1.6",
]

[tool.uv]
package = true

[project.scripts]
connections = "connections.main:cli"

[dependency-groups]
dev = [
    "isort==9.0.1",
    "black==26.5.1",
    "pytest==9.1.1",
    "pytest-mock==3.15.1",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "hypothesis>=6.98.0",
]

[tool.black]
line_length = 100
target-version = ["py314"]
src = ["src/", "tests/"]

[tool.isort]
profile = "black"
known_first_party = "connections"
src_paths = ["src/", "tests/"]
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
combine_as_imports = false
skip = [".git", "venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--strict-markers",
    "--strict-config",
    "--cov=src/connections",
    "--cov-report=term-missing",
    "--cov-report=term",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=80",
    "-n=auto"
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
]
branch = true
parallel = true
relative_files = true

[tool.poetry]
name = "connections"
version = "0.1.0"
description = "flight to connections map"
authors = ["Lucas Messenger <1335960+layertwo@users.noreply.github.com>"]
license = "Apache-2.0"
readme = "README.md"


[tool.poetry.scripts]
connections = "connections.main:cli"


[tool.poetry.dependencies]
python = "^3.11"
airports-py = "3.1.0"
plotly = "6.8.0"
geojson = "3.3.0"
click = "8.4.1"
setuptools = "^82.0.0"
kaleido = "1.3.0"
jinja2 = "^3.1.6"


[tool.poetry.group.dev.dependencies]
isort = "8.0.1"
black = "26.5.1"
pytest = "9.1.1"
pytest-mock = "3.15.1"
pytest-cov = "7.1.0"
hypothesis = ">=6.98.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.black]
line_length = 100


[tool.isort]
known_first_party = "connections"
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
combine_as_imports = false
skip = [".git", "venv"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--strict-markers",
    "--strict-config",
    "--cov=src/connections",
    "--cov-report=term-missing",
    "--cov-report=term",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=80"
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
]
branch = true
parallel = true
relative_files = true
